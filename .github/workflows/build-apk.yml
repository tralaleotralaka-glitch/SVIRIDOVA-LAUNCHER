name: Build APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Права на обёртку
        run: chmod +x ./gradlew

      - name: Сборка debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Имя файла
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          NAME="NEXUS-launcher-1.0-${SHORT_SHA}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "${NAME}.apk"
          ls -lh "${NAME}.apk"

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 30
